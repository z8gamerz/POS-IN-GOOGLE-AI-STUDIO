<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>JHEFF POS Cloud</title>
    <meta name="description" content="A vibrant, fully-featured cloud point-of-sale system." />
    <meta property="og:title" content="JHEFF POS Cloud" />
    <meta property="og:description" content="A vibrant, fully-featured cloud point-of-sale system." />
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#ea580c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JHEFF POS" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Automatic Device & OS Detection for Native Device Typography -->
    <script>
      (function() {
        try {
          var ua = navigator.userAgent || '';
          var platform = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
          var device = 'other';
          
          if (/iPad|iPhone|iPod/.test(ua) || (platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
            device = 'ios';
          } else if (/Macintosh|MacIntel|MacPPC|Mac68K/.test(ua) || /Mac OS X/.test(ua)) {
            device = 'macos';
          } else if (/Android/.test(ua)) {
            device = 'android';
          } else if (/Win32|Win64|Windows|WinCE/.test(ua) || /Windows NT/.test(ua)) {
            device = 'windows';
          } else if (/Linux/.test(platform) || /Linux/.test(ua)) {
            device = 'linux';
          }
          
          document.documentElement.setAttribute('data-device', device);
          document.documentElement.classList.add('device-' + device);
        } catch (e) {
          console.error('[Device Detection]', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker Registration & Deployment Auto-Updater -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[PWA] Service Worker registered successfully:', reg.scope);
              reg.update();
            })
            .catch((err) => console.error('[PWA] Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
